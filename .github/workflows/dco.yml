name: DCO

# The only layer an agent on your machine cannot bypass: it runs here, not
# there. `git push --no-verify` skips the local hook; it cannot skip this.
# Make it a required status check on the branch to actually gate merges.

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  signoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Every commit must be signed off by its author
        run: |
          set -eu
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"

          failed=0
          for sha in $(git rev-list "$base..$head"); do
            # Merge commits carry no sign-off by design.
            case "$(git show -s --format=%P "$sha")" in *' '*) continue ;; esac

            author_email="$(git show -s --format=%ae "$sha")"
            subject="$(git show -s --format=%s "$sha")"
            esc="$(printf '%s' "$author_email" | sed 's/[].[^$*\/]/\\&/g')"

            if git show -s --format=%B "$sha" |
               grep -qiE "^Signed-off-by:.*<$esc>[[:space:]]*$"; then
              echo "ok    $(git rev-parse --short "$sha")  $subject"
            else
              echo "FAIL  $(git rev-parse --short "$sha")  $subject"
              echo "      no 'Signed-off-by: ... <$author_email>' trailer"
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            cat <<'EOF'

          Some commits are not signed off. Review them, then certify:

              git signoff
              git push --force-with-lease

          Signing off rewrites the commits, so the push must be forced.
          See https://developercertificate.org/
          EOF
            exit 1
          fi

          echo "All commits signed off."
