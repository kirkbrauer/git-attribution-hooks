name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: ./test.sh
      - run: ./test-harnesses.sh
      - run: ./claude-code/test-install.sh
      - run: node --experimental-strip-types --test tests/integrations.mjs
